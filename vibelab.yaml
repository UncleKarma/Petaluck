version:
  name: "V1.1.0"
  notes: "新增彩色玫瑰与终章：八种纯色依次体验后，迎来彩色花朵、环绕花瓣雨、循环配乐和告别诗句。优化花瓣雨的覆盖、运动和持续时间，彩色终章发射器整体提高1米。细化花瓣曲面与外缘卷曲，降低碰撞网格复杂度，并修复重玩时的交互和祝福文字过渡。"
