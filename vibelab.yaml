  name: 一瓣欢喜
  slogan: 《一瓣欢喜》是一段藏在花朵中的温柔时光。
  description: |-
    《一瓣欢喜》是一段藏在花朵中的温柔时光。
    心里想着一个人，也可以只为自己。轻轻捏住花瓣，一片片摘下，让“喜欢”与“不喜欢”随花瓣飘落。最后一瓣落下时，答案交给偶然，欢喜留给自己。
